name: Build & Validate

on:
  push:
    branches:
      - master
      - refactor/*
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build dist/air-visual-card.js
        run: npm run build
